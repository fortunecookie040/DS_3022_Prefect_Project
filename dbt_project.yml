name: 'package_health'
version: '1.0.0'
profile: 'package_health'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

vars:
  window_start: '2024-01-01'   # fixed start of the analysis window (shared by all projects)

models:
  package_health:
    staging:
      +materialized: view      # thin typed/deduped layer over raw_* tables
    marts:
      +materialized: table     # Tasks 4-6 read these directly
