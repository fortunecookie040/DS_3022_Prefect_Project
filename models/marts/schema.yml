version: 2

models:
  - name: fct_pull_requests
    description: >
      One row per PR created on or after 2024-01-01, with precalculated durations and flags.
      PRs still open at run time are kept (is_open = true); their hours_to_merge / hours_to_close
      are NULL, so medians over those columns describe completed PRs only.
    columns:
      - name: pr_key
        description: "Primary key: repo || '#' || pr_number."
        data_tests: [unique, not_null]
      - name: repo
        description: "owner/name"
        data_tests: [not_null]
      - name: pr_number
        description: "PR number."
      - name: author_login
        description: "Login of the PR author."
      - name: author_is_bot
        description: "Bot rule applied to the PR author."
      - name: state
        description: "open or closed."
        data_tests:
          - accepted_values:
              arguments:
                values: ['open', 'closed']
      - name: created_at
        description: "When the PR was opened (UTC)."
      - name: updated_at
        description: "Last activity on the PR (UTC)."
      - name: closed_at
        description: "When the PR was closed, merged or not; NULL if open."
      - name: merged_at
        description: "When the PR was merged; NULL unless merged."
      - name: is_merged
        description: "merged_at IS NOT NULL."
      - name: is_closed_unmerged
        description: "state = 'closed' AND merged_at IS NULL."
      - name: is_open
        description: "state = 'open' (open at run time)."
      - name: first_review_at
        description: "Earliest submitted review not by the PR author and not by a bot."
      - name: hours_to_first_review
        description: "Hours from created_at to first_review_at; NULL if never reviewed."
      - name: hours_to_merge
        description: "Hours from created_at to merged_at; NULL unless merged."
      - name: hours_to_close
        description: "Hours from created_at to closed_at (merged or not); NULL if open."
      - name: is_stale
        description: "is_open AND updated_at < run time - 180 days."
      - name: has_approving_review
        description: "Any non-author, non-bot review with state APPROVED."
      - name: reviewed_within_7d
        description: "hours_to_first_review <= 168; false if never reviewed."

  - name: fct_releases
    description: "One row per published release on or after 2024-01-01."
    columns:
      - name: release_key
        description: "Primary key: repo || ':' || release_id."
        data_tests: [unique, not_null]
      - name: repo
        description: "owner/name"
      - name: release_id
        description: "GitHub release id."
      - name: tag_name
        description: "Git tag of the release."
      - name: published_at
        description: "When the release was published (UTC)."
      - name: is_prerelease
        description: "GitHub prerelease flag."
      - name: days_since_previous
        description: "Days since the repo's previous release (lag computed before the window filter)."

  - name: mart_repo_monthly
    description: "Repo x month from January 2024 through the run month; months with no activity show 0."
    columns:
      - name: repo_month
        description: "Primary key: repo || ':' || YYYY-MM."
        data_tests: [unique, not_null]
      - name: repo
        description: "owner/name"
        data_tests: [not_null]
      - name: month_start
        description: "First day of the month."
        data_tests: [not_null]
      - name: month_index
        description: "Months since January 2024 (0-based); x-axis for trend slopes."
      - name: prs_opened
        description: "PRs created this month."
      - name: prs_merged
        description: "PRs merged this month (by merged_at)."
      - name: prs_closed_unmerged
        description: "PRs closed without merging this month (by closed_at)."
      - name: merge_ratio
        description: "prs_merged / (prs_merged + prs_closed_unmerged); NULL when the denominator is 0."
      - name: median_first_review_hours
        description: "Median hours_to_first_review of PRs opened this month (unreviewed PRs excluded)."
      - name: median_merge_hours
        description: "Median hours_to_merge of PRs merged this month."
      - name: commits
        description: "Commits by commit.author.date month."
      - name: active_contributors
        description: "Distinct non-bot PR authors who opened a PR this month."
      - name: is_partial_month
        description: "True for the run month (not yet complete)."

  - name: mart_health_inputs
    description: >
      One row per repo; one column per candidate health metric for Task 5. Every column is a
      rate, share, median, or slope. PR-based metrics exclude bot-authored PRs.
    columns:
      - name: repo
        description: "owner/name (primary key)."
        data_tests: [unique, not_null]
      - name: commits_per_week
        description: "Activity. Commits in window / (window days / 7). Higher is healthier."
      - name: commit_trend
        description: "Activity trend. regr_slope(commits, month_index) over complete months (commits/month per month). Higher is healthier."
      - name: commit_trend_pct
        description: "Activity trend, size-normalized: commit_trend / average monthly commits (fractional change per month). Higher is healthier."
      - name: median_hours_to_first_review
        description: "Responsiveness. Median hours from PR open to first non-author, non-bot review. Lower is healthier."
      - name: pct_reviewed_within_7d
        description: "Responsiveness. Share of PRs created >= 7 days before run time that got a review within 7 days. Higher is healthier."
      - name: pct_merged_with_approval
        description: "Responsiveness/review quality. Share of merged PRs with an approving review. Higher is healthier."
      - name: merge_rate
        description: "Throughput. merged / (merged + closed unmerged). Higher is healthier."
      - name: median_hours_to_merge
        description: "Throughput. Median hours from open to merge, merged PRs only. Lower is healthier."
      - name: pct_open_stale
        description: "Backlog. Share of open PRs with no activity in 180+ days. Lower is healthier."
      - name: releases_per_year
        description: "Release cadence. Published releases in window / (window days / 365.25). Higher is healthier."
      - name: release_gap_cv
        description: "Release regularity. Coefficient of variation of days between releases. Lower is healthier."
      - name: active_contributors_per_month
        description: "Contributor base. Average distinct non-bot PR authors per complete month. Higher is healthier."
      - name: contributor_trend
        description: "Contributor trend. regr_slope(active_contributors, month_index) over complete months. Higher is healthier."
      - name: contributor_trend_pct
        description: "Contributor trend, size-normalized: contributor_trend / average monthly active contributors (fractional change per month). Higher is healthier."
      - name: bus_factor
        description: "Contributor base. Fewest authors accounting for >= 50% of merged human PRs. Higher is healthier."
